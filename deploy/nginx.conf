server {
    listen 80;
    server_name _;               # replace with your domain, e.g. asjad.dev www.asjad.dev
    root /usr/share/nginx/html;  # on a bare VPS use e.g. /var/www/portfolio
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # JS modules must be served with a JavaScript MIME type (nginx does this by default)
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    # content changes should show up immediately
    location /data/ { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }
}
